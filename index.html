function $(id){return document.getElementById(id)}

const lock=$("lock"), input=$("lockInput"), error=$("lockError");
function unlock(){
  if(input.value.trim().toLowerCase()===PASSCODE){
    lock.classList.add("hidden");
    sessionStorage.setItem("badmas_unlocked","1");
  }else{
    error.textContent="That's not it — try again";
    input.select();
  }
}
$("lockBtn").onclick=unlock;
input.onkeydown=e=>{if(e.key==="Enter")unlock()};
if(sessionStorage.getItem("badmas_unlocked")==="1")lock.classList.add("hidden");

const audioBadge=$("badgeAudio"), soundFile=$("soundFile"), soundBadge=$("soundBadge");
let badgeUrl=null;
soundBadge.addEventListener("click",e=>{
  if(e.target===soundFile)return;
  if(badgeUrl){audioBadge.currentTime=0;audioBadge.play().catch(()=>{})}
  else soundFile.click();
});
soundFile.onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  if(badgeUrl)URL.revokeObjectURL(badgeUrl);
  badgeUrl=URL.createObjectURL(f);
  audioBadge.src=badgeUrl;

  { title: "Never Enough", artist: "Audio", url: "never_enough.mp3" },
  { title: "Triple OG", artist: "Audio", url: "triple_og.mp3" },
  { title: "Wanna Know", artist: "Audio", url: "wanna_know.mp3" },
  { title: "Blowing Up", artist: "Audio", url: "blowing_up.mp3" },
  { title: "Khatta Flow", artist: "KRSNA / Seedhe Maut", url: "khatta_flow.mp3" },
  { title: "Vibrate", artist: "Audio", url: "vibrate.mp3" },
  { title: "Prarthana", artist: "KR$NA", url: "Prarthana.mp3" }
];

function loadTrack(index) {
  if (index < 0 || index >= tracks.length) return;
  current = index;
  const t = tracks[current];
  audio.src = t.url;
  $("trackTitle").textContent = t.title;
  $("trackArtist").textContent = t.artist;
  
  const items = document.querySelectorAll(".track");
  items.forEach((item, i) => item.classList.toggle("active", i === current));
  
  audio.play().then(() => {
    $("art").classList.add("spin");
  }).catch(() => {
    $("art").classList.remove("spin");
  });
}

function renderPlaylist() {
  const list = $("tracklist");
  list.innerHTML = "";
  tracks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "track";
    div.innerHTML = `
      <span class="num">${i + 1}</span>
      <div class="meta">
        <div class="name">${t.title}</div>
        <div class="artist">${t.artist}</div>
      </div>
    `;
    div.onclick = () => loadTrack(i);
    list.appendChild(div);
  });
}

$("playBtn").onclick = () => {
  if (current === -1 && tracks.length > 0) {
    loadTrack(0);
    return;
  }
  if (audio.paused) {
    audio.play();
    $("art").classList.add("spin");
  } else {
    audio.pause();
    $("art").classList.remove("spin");
  }
};

$("prevBtn").onclick = () => loadTrack((current - 1 + tracks.length) % tracks.length);
$("nextBtn").onclick = () => loadTrack((current + 1) % tracks.length);
$("rewindBtn").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
$("forwardBtn").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);

audio.ontimeupdate = () => {
  if (audio.duration) {
    $("progress").value = (audio.currentTime / audio.duration) * 100;
    $("time").textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }
};

$("progress").oninput = (e) => {
  if (audio.duration) {
    audio.currentTime = (e.target.value / 100) * audio.duration;
  }
};

audio.onended = () => loadTrack((current + 1) % tracks.length);

renderPlaylist();
</script>
</body>
</html>
